name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deterministic validation
    runs-on: macos-15
    timeout-minutes: 25
    env:
      LAZYBUDDY_VERIFY_SUITE: core
      LAZYBUDDY_VERIFY_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run package verification
        run: bash lazybuddy-plugin/scripts/lazybuddy-verify.sh

      - name: Run publication verification
        run: bash lazybuddy-plugin/tests/publication-regression.sh

  lifecycle:
    name: Lifecycle regressions (advisory)
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    env:
      LAZYBUDDY_VERIFY_SUITE: lifecycle
      LAZYBUDDY_VERIFY_TIMEOUT_SECONDS: 240
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Run timing-sensitive lifecycle regressions
        run: bash lazybuddy-plugin/scripts/lazybuddy-verify.sh
