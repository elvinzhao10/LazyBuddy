name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run plugin doctor
        run: bash lazyworkbuddy-plugin/scripts/lazyworkbuddy-plugin-doctor.sh

      - name: Run smoke test
        run: bash lazyworkbuddy-plugin/scripts/lazyworkbuddy-smoke-test.sh

      - name: Run security check
        run: bash lazyworkbuddy-plugin/scripts/lazyworkbuddy-security-check.sh

      - name: Run docs check
        run: bash lazyworkbuddy-plugin/scripts/lazyworkbuddy-docs-check.sh
