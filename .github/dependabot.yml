version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, maintenance]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /lazybuddy-plugin/tooling
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      tooling:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /lazybuddy-plugin/tooling/lsp/python
    schedule:
      interval: monthly
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /lazybuddy-plugin/tooling/lsp/typescript
    schedule:
      interval: monthly
    labels: [dependencies]
